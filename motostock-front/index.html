<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Acceso | MotoStock</title>
    <link rel="stylesheet" href="css/site.css">
</head>

<body>
    <main class="auth-layout">
        <section class="auth-brand"><a class="brand" href="cliente.html">MOTO<span>STOCK</span></a>
            <p class="eyebrow">REPUESTOS & KM VERDE</p>
            <h1>Tu próxima ruta<br>empieza aquí.</h1>
            <p>Encuentra repuestos, cuida tu moto y dale valor a las piezas que renuevas.</p><a class="button outline"
                href="cliente.html">Explorar catálogo</a>
        </section>
        <section class="auth-card">
            <div class="switch"><button id="show-login" class="selected">Iniciar sesión</button><button
                    id="show-register">Crear cuenta</button></div>
            <form id="login" novalidate>
                <h2>Bienvenido de nuevo</h2><label>Correo<input name="email" type="email" autocomplete="username"
                        required aria-describedby="login-email"><small id="login-email"
                        data-error="email"></small></label><label>Contraseña<input name="password" type="password"
                        autocomplete="current-password" required aria-describedby="login-password"><small
                        id="login-password" data-error="password"></small></label>
                <p data-message role="status"></p><button class="button">Iniciar sesión</button>
            </form>
            <form id="register" hidden novalidate>
                <h2>Empieza a rodar</h2><label>Nombre<input name="nombre" maxlength="100" autocomplete="name" required
                        aria-describedby="reg-nombre"><small id="reg-nombre"
                        data-error="nombre"></small></label><label>Correo<input name="email" type="email"
                        autocomplete="email" required aria-describedby="reg-email"><small id="reg-email"
                        data-error="email"></small></label><label>Contraseña<input name="password" type="password"
                        autocomplete="new-password" required aria-describedby="reg-password"><small id="reg-password"
                        data-error="password"></small></label>
                <p class="muted">Mínimo 8 caracteres. Las cuentas nuevas tienen rol cliente.</p>
                <p data-message role="status"></p><button class="button">Crear cuenta</button>
            </form>
        </section>
    </main>
    <script type="module" src="js/pages/auth.page.js"></script>
</body>

</html>
